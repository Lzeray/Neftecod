    cannot raise the product sulfur (eq 13-15)) -> clipped to 0'
  - 'HDS:P3~lag: fitted +0.3438, physics requires sign -1 (Higher loop pressure raises
    p_H2 (eq 17-18) and therefore the HDS rate (eq 13)) -> clipped to 0'
  - 'HDS:F26~lag: fitted -0.01692, physics requires sign +1 (More feed means a higher
