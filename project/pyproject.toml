[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avt-hds-blend-optimizer"
version = "1.0.0"
description = "Chance-constrained multi-agent quality optimiser for the AVT -> hydrotreater -> blending diesel chain"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
